name: Reusable Pages deployment

'on':
  workflow_call:
    inputs:
      source-artifact-name:
        description: Name of the caller-produced static-site artifact
        required: true
        type: string
      source-subdirectory:
        description: Safe relative directory inside the downloaded artifact
        required: false
        default: .
        type: string
    outputs:
      page-url:
        description: URL reported by the Pages deployment
        value: ${{ jobs.deploy.outputs.page-url }}

permissions:
  contents: read

jobs:
  prepare-pages-artifact:
    name: Prepare Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate artifact contract
        shell: bash
        env:
          SOURCE_ARTIFACT_NAME: ${{ inputs.source-artifact-name }}
          SOURCE_SUBDIRECTORY: ${{ inputs.source-subdirectory }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "invalid source-artifact-name" >&2; exit 1; }
          [[ "$SOURCE_ARTIFACT_NAME" != "." && "$SOURCE_ARTIFACT_NAME" != ".." ]] || { echo "invalid source-artifact-name" >&2; exit 1; }
          [[ "$SOURCE_SUBDIRECTORY" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "invalid source-subdirectory" >&2; exit 1; }
          case "$SOURCE_SUBDIRECTORY" in
            ''|/*|..|../*|*/../*|*/..) echo "invalid source-subdirectory" >&2; exit 1 ;;
          esac

      - name: Download caller artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.source-artifact-name }}
          path: ${{ runner.temp }}/pages-source

      - name: Validate downloaded tree
        shell: bash
        env:
          SOURCE_SUBDIRECTORY: ${{ inputs.source-subdirectory }}
        run: |
          set -euo pipefail
          base="$(realpath -- "$RUNNER_TEMP/pages-source")"
          source_path="$base/$SOURCE_SUBDIRECTORY"
          [[ -d "$source_path" && ! -L "$source_path" ]] || { echo "source-subdirectory must identify a real directory" >&2; exit 1; }
          resolved="$(realpath -- "$source_path")"
          case "$resolved" in
            "$base"|"$base"/*) ;;
            *) echo "source-subdirectory escapes the artifact" >&2; exit 1 ;;
          esac
          if find "$base" -type l -print -quit | grep -q .; then
            echo "symlinks are forbidden in Pages source artifacts" >&2
            exit 1
          fi
          if find "$resolved" ! -type f ! -type d -print -quit | grep -q .; then
            echo "special files are forbidden in Pages source artifacts" >&2
            exit 1
          fi
          [[ -n "$(find "$resolved" -type f -print -quit)" ]] || { echo "Pages source is empty" >&2; exit 1; }
          printf '%s\n' "$resolved" > "$RUNNER_TEMP/pages-path"

      - name: Upload standard Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-source/${{ inputs.source-subdirectory }}
          retention-days: 1

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    needs: prepare-pages-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages
