name: Reusable release

'on':
  workflow_call:
    inputs:
      source-artifact-name:
        description: Name of the caller-produced release asset artifact
        required: true
        type: string
      version:
        description: Full Semantic Version without a v prefix
        required: true
        type: string
      publish:
        description: Must remain false; this workflow version is permanently dry-run
        required: false
        default: false
        type: boolean
    outputs:
      candidate-artifact-name:
        description: Short-lived artifact containing release evidence
        value: ${{ jobs.prepare.outputs.candidate-artifact-name }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate-artifact-name: ${{ steps.candidate.outputs.name }}
    steps:
      - name: Reject publication requests
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH" == "false" ]] || {
            echo "publication is unavailable in this workflow version" >&2
            exit 1
          }

      - name: Check out tagged caller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity
        shell: bash
        env:
          SOURCE_ARTIFACT_NAME: ${{ inputs.source-artifact-name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SEMVER_PATTERN='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*)))*)?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          [[ "$VERSION" =~ $SEMVER_PATTERN ]] || { echo "version is not full SemVer" >&2; exit 1; }
          [[ "$SOURCE_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "invalid source-artifact-name" >&2; exit 1; }
          [[ "$SOURCE_ARTIFACT_NAME" != "." && "$SOURCE_ARTIFACT_NAME" != ".." ]] || { echo "invalid source-artifact-name" >&2; exit 1; }
          [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == "v${VERSION}" ]] || { echo "release requires tag v${VERSION}" >&2; exit 1; }
          tag_commit="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]] || { echo "tag does not identify the workflow commit" >&2; exit 1; }

      - name: Download source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.source-artifact-name }}
          path: ${{ runner.temp }}/release-source

      - name: Validate artifact metadata and paths
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/release-source"
          [[ -d "$source" && ! -L "$source" ]] || { echo "release source is missing" >&2; exit 1; }
          if find "$source" -type l -print -quit | grep -q .; then
            echo "symlinks are forbidden in release artifacts" >&2
            exit 1
          fi
          if find "$source" ! -type f ! -type d -print -quit | grep -q .; then
            echo "special files are forbidden in release artifacts" >&2
            exit 1
          fi
          if find "$source" -mindepth 2 -type f -print -quit | grep -q .; then
            echo "release assets must be top-level files" >&2
            exit 1
          fi
          [[ -f "$source/release-metadata.json" && ! -L "$source/release-metadata.json" ]] || { echo "release-metadata.json is required" >&2; exit 1; }
          [[ -n "$(find "$source" -maxdepth 1 -type f ! -name release-metadata.json -print -quit)" ]] || { echo "release artifact contains no publishable assets" >&2; exit 1; }
          jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" '
            type == "object" and
            (keys | sort) == ["commit", "version"] and
            .version == $version and .commit == $commit
          ' "$source/release-metadata.json" >/dev/null
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,200}$ ]] || { echo "unsafe release asset name" >&2; exit 1; }
            case "$name" in
              SHA256SUMS|SBOM.spdx.json|LICENSES.json) echo "reserved release asset name: $name" >&2; exit 1 ;;
            esac
          done < <(find "$source" -maxdepth 1 -type f -print0)

      - name: Generate checksums, SBOM, and license evidence
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/release-source"
          bundle="$RUNNER_TEMP/release-candidate"
          mkdir -- "$bundle"
          while IFS= read -r -d '' file; do
            cp -- "$file" "$bundle/${file##*/}"
          done < <(find "$source" -maxdepth 1 -type f ! -name release-metadata.json -print0)
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          BUNDLE="$bundle" REPOSITORY="$GITHUB_REPOSITORY" COMMIT="$GITHUB_SHA" RUN_ID="$GITHUB_RUN_ID" VERSION="$VERSION" CREATED="$created" ruby <<'RUBY'
          require "digest"
          require "json"
          require "time"

          bundle = ENV.fetch("BUNDLE")
          files = Dir.children(bundle).sort.select { |name| File.file?(File.join(bundle, name)) }
          file_records = files.map.with_index do |name, index|
            path = File.join(bundle, name)
            sha1 = Digest::SHA1.file(path).hexdigest
            sha256 = Digest::SHA256.file(path).hexdigest
            {"sha1" => sha1, "spdx" => {
              "SPDXID" => "SPDXRef-File-#{index + 1}",
              "fileName" => "./#{name}",
              "checksums" => [
                {"algorithm" => "SHA1", "checksumValue" => sha1},
                {"algorithm" => "SHA256", "checksumValue" => sha256}
              ],
              "licenseConcluded" => "NOASSERTION",
              "licenseInfoInFiles" => ["NOASSERTION"],
              "copyrightText" => "NOASSERTION"
            }}
          end
          spdx_files = file_records.map { |record| record.fetch("spdx") }
          verification_code = Digest::SHA1.hexdigest(file_records.map { |record| record.fetch("sha1") }.sort.join)
          package_id = "SPDXRef-Package"
          sbom = {
            "spdxVersion" => "SPDX-2.3",
            "dataLicense" => "CC0-1.0",
            "SPDXID" => "SPDXRef-DOCUMENT",
            "name" => "#{ENV.fetch("REPOSITORY")} release #{ENV.fetch("VERSION", "unknown")}",
            "documentNamespace" => "https://github.com/#{ENV.fetch("REPOSITORY")}/release-candidates/#{ENV.fetch("COMMIT")}/#{ENV.fetch("RUN_ID")}",
            "creationInfo" => {"created" => Time.iso8601(ENV.fetch("CREATED")).utc.iso8601, "creators" => ["Tool: tinkora-release-workflow"]},
            "packages" => [{
              "SPDXID" => package_id,
              "name" => ENV.fetch("REPOSITORY"),
              "versionInfo" => ENV.fetch("VERSION", "unknown"),
              "downloadLocation" => "NOASSERTION",
              "filesAnalyzed" => true,
              "packageVerificationCode" => {"packageVerificationCodeValue" => verification_code},
              "licenseConcluded" => "NOASSERTION",
              "licenseDeclared" => "NOASSERTION",
              "copyrightText" => "NOASSERTION"
            }],
            "files" => spdx_files,
            "relationships" => [
              {"spdxElementId" => "SPDXRef-DOCUMENT", "relationshipType" => "DESCRIBES", "relatedSpdxElement" => package_id},
              *spdx_files.map { |file| {"spdxElementId" => package_id, "relationshipType" => "CONTAINS", "relatedSpdxElement" => file.fetch("SPDXID")} }
            ]
          }
          File.write(File.join(bundle, "SBOM.spdx.json"), JSON.pretty_generate(sbom) + "\n", encoding: "UTF-8")

          licenses = Dir.glob(File.join(ENV.fetch("GITHUB_WORKSPACE"), "{LICENSE,LICENSE.*,COPYING,COPYING.*,NOTICE,NOTICE.*}"))
            .select { |path| File.file?(path) && !File.symlink?(path) }
            .sort
            .map do |path|
              {"name" => File.basename(path), "sha256" => Digest::SHA256.file(path).hexdigest, "text" => File.read(path, encoding: "UTF-8")}
            end
          raise "caller repository must contain a top-level license file" if licenses.empty?
          File.write(File.join(bundle, "LICENSES.json"), JSON.pretty_generate({"licenses" => licenses}) + "\n", encoding: "UTF-8")
          RUBY
          (
            cd -- "$bundle"
            : > SHA256SUMS
            while IFS= read -r -d '' file; do
              shasum -a 256 -- "$file" >> SHA256SUMS
            done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z)
          )
          subjects="$bundle/release-subjects"
          mkdir -- "$subjects"
          subject_count=0
          while IFS= read -r relative; do
            name="${relative#./}"
            [[ "$relative" == "./${name}" && "$name" != */* && -f "$bundle/$name" ]] || { echo "invalid SBOM subject path" >&2; exit 1; }
            cp -- "$bundle/$name" "$subjects/$name"
            subject_count=$((subject_count + 1))
          done < <(jq -r '.files[].fileName' "$bundle/SBOM.spdx.json")
          ((subject_count > 0)) || { echo "SBOM contains no dry-run subjects" >&2; exit 1; }

      - name: Name candidate artifact
        id: candidate
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: echo "name=release-candidate-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload short-lived release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ inputs.version }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
