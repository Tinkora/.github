name: Documentation quality

'on':
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - 'scripts/check_docs.rb'
      - 'scripts/check_external_links.rb'
      - 'config/github-settings-policy.json'
      - 'scripts/check_github_settings_audit.rb'
      - '.github/workflows/docs-quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - 'scripts/check_docs.rb'
      - 'scripts/check_external_links.rb'
      - 'config/github-settings-policy.json'
      - 'scripts/check_github_settings_audit.rb'
      - '.github/workflows/docs-quality.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-documentation:
    name: Markdown and local contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check required files, translations, governance, and local links
        shell: bash
        run: ruby scripts/check_docs.rb

  trusted-external-links:
    name: External links
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check external HTTPS links
        shell: bash
        run: ruby scripts/check_external_links.rb
